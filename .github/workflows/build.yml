name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL (http ya https)'
        required: true
        default: 'http://129.213.64.181'
      app_name:
        description: 'App ka naam'
        required: true
        default: 'My Site'
      package_id:
        description: 'Package ID (chhote letters, dots; har app ka alag)'
        required: true
        default: 'com.my.siteapp'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          APP_PKG: ${{ inputs.package_id }}
        run: |
          mkdir -p app/src/main/java/com/my/siteapp
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SiteApp"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.my.siteapp'
              compileSdk 34
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="__NAME__"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/my/siteapp/MainActivity.java <<'EOF'
          package com.my.siteapp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Menu;
          import android.view.MenuItem;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              WebView w;
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  w = new WebView(this);
                  setContentView(w);
                  setTitle("__NAME__");
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  w.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("__URL__");
              }
              @Override public boolean onCreateOptionsMenu(Menu m) {
                  m.add(0, 1, 0, "Refresh").setShowAsAction(
                      MenuItem.SHOW_AS_ACTION_ALWAYS | MenuItem.SHOW_AS_ACTION_WITH_TEXT);
                  return true;
              }
              @Override public boolean onOptionsItemSelected(MenuItem i) {
                  if (i.getItemId() == 1) { w.reload(); return true; }
                  return super.onOptionsItemSelected(i);
              }
              @Override public void onBackPressed() {
                  if (w.canGoBack()) w.goBack(); else super.onBackPressed();
              }
          }
          EOF
          python3 - <<'PY'
          import os, re
          url = os.environ['APP_URL'].strip()
          name = os.environ['APP_NAME'].strip()
          pkg = os.environ['APP_PKG'].strip()
          if not re.match(r'^https?://', url):
              url = 'http://' + url
          if not re.match(r'^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', pkg):
              raise SystemExit('Package ID galat hai. Example: com.my.siteapp')
          def j(s): return s.replace('\\', '\\\\').replace('"', '\\"')
          def x(s): return s.replace('&', '&amp;').replace('<', '&lt;').replace('"', '&quot;')
          def sub(path, pairs):
              t = open(path, encoding='utf-8').read()
              for a, b in pairs:
                  t = t.replace(a, b)
              open(path, 'w', encoding='utf-8').write(t)
          sub('app/build.gradle', [('__PKG__', pkg)])
          sub('app/src/main/AndroidManifest.xml', [('__NAME__', x(name))])
          sub('app/src/main/java/com/my/siteapp/MainActivity.java',
              [('__NAME__', j(name)), ('__URL__', j(url))])
          PY
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SiteApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
